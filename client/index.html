<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11130f" />
    <meta name="application-name" content="SURA" />
    <meta name="description" content="SURA is Africa’s visual network for people, businesses, objects, spaces, culture and the details that make life feel like yours." />
    <meta property="og:title" content="SURA — Africa’s visual network." />
    <meta property="og:description" content="See a signal. Shape a direction. Meet the people who make it real." />
    <meta property="og:image" content="/assets/sura-auth-hero.jpg" />
    <link rel="icon" href="/sura-favicon-africa-rhythm.png?v=5" type="image/png" />
    <link rel="apple-touch-icon" href="/sura-favicon-africa-rhythm.png?v=5" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'; this.onload=null" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" /></noscript>
    <style>
      #critical-shell { min-height: 100vh; overflow: hidden; background: #11130f; color: #f3f0e7; font-family: Manrope, system-ui, sans-serif; }
      #root:has(.sura-shell) #critical-shell { display: none; }
      #critical-shell header { display: flex; height: 68px; align-items: center; justify-content: space-between; border-bottom: 1px solid rgb(243 240 231 / .1); padding: 0 20px; }
      #critical-shell .critical-logo { display: flex; align-items: center; gap: 10px; font-family: "Space Grotesk", system-ui, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -.08em; }
      #critical-shell .critical-mark { display: block; height: 36px; width: 36px; border-radius: 10px; background: #caff32; object-fit: cover; }
      #critical-shell .critical-action { border: 1px solid #caff32; border-radius: 12px; background: #caff32; color: #11130f; padding: 11px 13px; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      #critical-shell main { padding: 40px 20px 64px; }
      #critical-shell .critical-wrap { max-width: 1320px; margin: 0 auto; }
      #critical-shell .critical-kicker { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; color: rgb(243 240 231 / .55); font-family: "DM Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
      #critical-shell .critical-kicker::before { width: 48px; height: 1px; background: #caff32; content: ""; }
      #critical-shell h1 { max-width: 720px; margin: 0; font-family: "Space Grotesk", system-ui, sans-serif; font-size: clamp(3.5rem, 8vw, 8rem); font-weight: 700; letter-spacing: -.075em; line-height: .92; }
      #critical-shell h1 span { color: #caff32; }
      #critical-shell p { max-width: 520px; margin: 28px 0 0; color: rgb(243 240 231 / .62); font-size: 18px; line-height: 2; }
      #critical-shell .critical-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
      #critical-shell .critical-ghost { border: 1px solid rgb(243 240 231 / .22); border-radius: 12px; color: #f3f0e7; padding: 13px 17px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      @media (min-width: 640px) { #critical-shell header { padding: 0 32px; } #critical-shell main { padding: 64px 32px 96px; } }
    </style>
    <title>SURA — Africa’s visual network.</title>
  </head>
  <body>
    <noscript>SURA needs JavaScript to open the visual network.</noscript>
    <div id="root"><div id="critical-shell" aria-hidden="true"><header><div class="critical-logo"><img class="critical-mark" src="/sura-favicon-africa-rhythm.png?v=5" alt="" /><span>SURA</span></div><span class="critical-action">Enter signal</span></header><main><div class="critical-wrap"><div class="critical-kicker">Africa / visual network / 001</div><h1>Make the <span>feeling</span> findable.</h1><p>SURA connects people, businesses, objects, spaces and next steps across Africa to the way you want life to feel.</p><div class="critical-actions"><span class="critical-action">Start your direction</span><span class="critical-ghost">See the field</span></div></div></main></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
